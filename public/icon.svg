<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 地球主体渐变 -->
    <linearGradient id="globeGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- 地球内部发光填充渐变 -->
    <radialGradient id="globeInner" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.05" />
    </radialGradient>

    <!-- 梯子立柱渐变（暖色对比） -->
    <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#FFA700" />
      <stop offset="100%" stop-color="#FF5E00" />
    </linearGradient>

    <!-- 梯子横档渐变 -->
    <linearGradient id="rungGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <!-- 全局柔和投影 -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 梯子专属投影（增强与地球的层次感） -->
    <filter id="ladderShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="8" stdDeviation="6" flood-color="#050814" flood-opacity="0.45" />
    </filter>

    <!-- 节点发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景装饰微光（无底色，随主题背景透出） -->
  <circle cx="230" cy="270" r="190" fill="url(#globeGrad)" opacity="0.08" />

  <!-- 外部环绕网络轨道（后景） -->
  <ellipse cx="230" cy="270" rx="195" ry="65" fill="none" stroke="url(#globeGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" transform="rotate(-28 230 270)" />

  <!-- 网络地球主体 -->
  <g id="network-globe" filter="url(#dropShadow)" transform="translate(230, 270)">
    <circle cx="0" cy="0" r="145" fill="url(#globeInner)" stroke="url(#globeGrad)" stroke-width="10" />

    <ellipse cx="0" cy="0" rx="60" ry="145" fill="none" stroke="url(#globeGrad)" stroke-width="6.5" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="112" ry="145" fill="none" stroke="url(#globeGrad)" stroke-width="5.5" opacity="0.6" />

    <rect x="-3.25" y="-145" width="6.5" height="290" fill="url(#globeGrad)" opacity="0.85" />
    <rect x="-145" y="-3.25" width="290" height="6.5" fill="url(#globeGrad)" opacity="0.85" />

    <path d="M -126 -70 Q 0 -42 126 -70" fill="none" stroke="url(#globeGrad)" stroke-width="6.5" opacity="0.85" />
    <path d="M -126 70 Q 0 42 126 70" fill="none" stroke="url(#globeGrad)" stroke-width="6.5" opacity="0.85" />

    <g filter="url(#glow)">
      <circle cx="-60" cy="0" r="9" fill="#FFFFFF" stroke="#00F2FE" stroke-width="4" />
      <circle cx="0" cy="-56" r="8" fill="#FFFFFF" stroke="#00F2FE" stroke-width="4" />
      <circle cx="55" cy="56" r="8" fill="#FFFFFF" stroke="#00F2FE" stroke-width="4" />
      <circle cx="-102" cy="-65" r="7" fill="#00F2FE" />
      <circle cx="-98" cy="64" r="7" fill="#00F2FE" />
      <circle cx="0" cy="56" r="6" fill="#00F2FE" />
    </g>
  </g>

  <!-- 梯子主体 -->
  <g id="ladder" filter="url(#ladderShadow)" transform="translate(345, 255) rotate(22)">
    <g fill="url(#rungGrad)">
      <rect x="-36" y="-117" width="72" height="14" rx="7" />
      <rect x="-36" y="-62" width="72" height="14" rx="7" />
      <rect x="-36" y="-7" width="72" height="14" rx="7" />
      <rect x="-36" y="48" width="72" height="14" rx="7" />
      <rect x="-36" y="103" width="72" height="14" rx="7" />
    </g>

    <g fill="#FFF6B7" opacity="0.55">
      <rect x="-26" y="-115" width="52" height="3" rx="1.5" />
      <rect x="-26" y="-60" width="52" height="3" rx="1.5" />
      <rect x="-26" y="-5" width="52" height="3" rx="1.5" />
      <rect x="-26" y="50" width="52" height="3" rx="1.5" />
      <rect x="-26" y="105" width="52" height="3" rx="1.5" />
    </g>

    <rect x="-43" y="-174" width="18" height="348" rx="9" fill="url(#ladderGrad)" />
    <rect x="25" y="-174" width="18" height="348" rx="9" fill="url(#ladderGrad)" />

    <rect x="-39" y="-160" width="3.5" height="320" rx="1.75" fill="#FFF6B7" opacity="0.65" />
    <rect x="29" y="-160" width="3.5" height="320" rx="1.75" fill="#FFF6B7" opacity="0.65" />
  </g>

  <!-- 顶部连接星光 -->
  <g transform="translate(415, 85)" filter="url(#glow)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#FFF6B7" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>
  <circle cx="350" cy="70" r="4" fill="#00F2FE" opacity="0.8" filter="url(#glow)" />
  <circle cx="445" cy="145" r="5" fill="#FFA700" opacity="0.8" filter="url(#glow)" />
</svg>
